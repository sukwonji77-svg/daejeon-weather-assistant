services:
  - type: web
    name: daejeon-weather-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: FIREBASE_PROJECT_ID
        value: daejeon-weather-assistant
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: APP_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
